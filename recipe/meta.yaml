{% set name = "swapper" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/swapper-{{ version }}.tar.gz
  sha256: 405f934265aa0c8d8b8e6b1be584875d1a3b7de6b1cd6f47367a4dbdc028609a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools-scm
    - setuptools
  run:
    - python >={{ python_min }}

test:
  source_files:
    - tests
  imports:
    - swapper
  commands:
    - pip check
    - pytest -vvv --capture=tee-sys tests
  requires:
    - django >=2.0
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/openwisp/django-swappable-models
  summary: The unofficial Django swappable models API
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
